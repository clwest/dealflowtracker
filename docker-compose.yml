# DealFlowTracker — prod-like fleet compose
#
# Pattern reference: /Users/donkeyking/development/infra/README.md

services:
  dealflowtracker_postgres:
    image: pgvector/pgvector:pg16
    container_name: dealflowtracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealflow}
      POSTGRES_USER: ${POSTGRES_USER:-dealflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - dealflowtracker_postgres_data:/var/lib/postgresql/data
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealflow} -d ${POSTGRES_DB:-dealflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dealflowtracker_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealflowtracker_api
    restart: unless-stopped
    depends_on:
      dealflowtracker_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dealflow}:${POSTGRES_PASSWORD:-change-me-in-production}@dealflowtracker_postgres:5432/${POSTGRES_DB:-dealflow}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      SECRET_KEY: ${SECRET_KEY:-dev-only-rotate-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5178}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5178}
      PORT: "8006"
    ports:
      - "8006:8006"
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8006/api/health\",timeout=2).status==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dealflowtracker_web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8006/api}
    container_name: dealflowtracker_web
    restart: unless-stopped
    depends_on:
      - dealflowtracker_api
    ports:
      - "5178:80"
    networks:
      - fleet-net

volumes:
  dealflowtracker_postgres_data:
    name: dealflowtracker_postgres_data

networks:
  fleet-net:
    external: true
    name: fleet-net
