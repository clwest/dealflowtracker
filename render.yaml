databases:
  - name: dealflowtracker-db
    plan: free
    databaseName: dealflowtracker
    user: dealflowtracker

services:
  - type: web
    name: dealflowtracker-api
    plan: free
    runtime: python
    buildCommand: cd backend && pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5-mini
      - key: DATABASE_URL
        fromDatabase:
          name: dealflowtracker-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
